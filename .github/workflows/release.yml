name: Release

# Triggered by pushing a semver tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Pack, publish & release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Chronosix.sln

      - name: Build (Release)
        run: dotnet build Chronosix.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: |
          dotnet pack src/Chronosix/Chronosix.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.value }} --output ./artifacts
          dotnet pack adapters/Chronosix.Quartz/Chronosix.Quartz.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.value }} --output ./artifacts
          dotnet pack adapters/Chronosix.Hangfire/Chronosix.Hangfire.csproj --configuration Release --no-build -p:Version=${{ steps.version.outputs.value }} --output ./artifacts

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Chronosix ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: ./artifacts/*.nupkg
          body: |
            ## Chronosix ${{ steps.version.outputs.value }}

            In-process scheduled task & background worker dashboard for ASP.NET Core.

            ### Packages
            - `Chronosix` — core library, embedded dashboard, REST API and SignalR hub.
            - `Chronosix.Quartz` — Quartz.NET adapter.
            - `Chronosix.Hangfire` — Hangfire adapter.

            Install with `dotnet add package Chronosix`.

            See the full changelog in [CHANGELOG.md](https://github.com/sureshsubramanian/Chronosix/blob/main/CHANGELOG.md).
